<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Boti AI</title><style>body{margin:0;background:#000;color:#fff;font-family:sans-serif;display:flex;flex-direction:column;height:100vh}header{padding:15px;text-align:center;background:#111}#chat{flex:1;overflow:auto;padding:15px}.msg{margin:8px;padding:12px;border-radius:15px;max-width:85%}.user{background:#2563eb;margin-left:auto}.bot{background:#222}#box{display:flex;padding:10px;gap:8px;background:#111}input{flex:1;padding:12px;border-radius:20px;border:none;background:#222;color:#fff}button{padding:12px 18px;border-radius:20px;border:none;background:#2563eb;color:#fff}</style></head><body><header>🤖 Боти ман</header><div id="chat"><div class="msg bot">Салом! Савол деҳ!</div></div><div id="box"><input id="q" placeholder="Нависед..."><button onclick="send()">Ирсол</button></div><script>let c=document.getElementById('chat');function add(t,k){let d=document.createElement('div');d.className='msg '+k;d.innerText=t;c.appendChild(d);c.scrollTop=99999}function send(){let v=document.getElementById('q').value;if(!v)return;add(v,'user');document.getElementById('q').value='';setTimeout(()=>add('Ту пурсидӣ: '+v+' - Ман боти ту!','bot'),600);}</script></body></html>
